{% extends 'base/base.html' %}
{% load static %}
{% block content %}
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">

    {% if not bought_games %}
        <p class="no-articles">No bought games yet</p>
    {% else %}

        <section id="welcome-world">
            {% for bought_game in bought_games %}
                {% with game=bought_game.game %}
                    {% include 'game/partials/game-card.html' %}
                {% endwith %}
            {% endfor %}
        </section>

    {% endif %}
{% endblock %}
