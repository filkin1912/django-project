{% extends 'base/base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'styles/style.css' %}">

{% if not games %}
    <p class="no-articles">No games yet</p>
{% else %}
    <p class="no-articles">ALL NEW GAMES</p>
    <section id="welcome-world">
        {% for game in games %}
            {% include 'game/partials/game-card.html' %}
        {% endfor %}
    </section>
{% endif %}
{% endblock %}
