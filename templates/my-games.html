{% extends 'base/base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'styles/style.css' %}">

{% if not games %}
    <p class="no-articles">No games yet</p>
{% else %}
    <section id="welcome-world">
        {% for game in games %}
            <div class="game">
                <div class="image-wrap">
                    <img src="{{ game.game_picture.url }}" alt="{{ game.title }}">
                </div>
                <h3>{{ game.title }}</h3>
                <h1>{{ game.category }}</h1>
                <div class="data-buttons">
                    <a href="{% url 'game details' pk=game.pk %}" class="btn btn--details">Details</a>
                </div>
            </div>
        {% endfor %}
    </section>
{% endif %}
{% endblock %}
